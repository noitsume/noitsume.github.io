name: CI - Test and Docker

on:
  push:
    branches: [main, development, docker-ci, docker-publish]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Lint, unit tests, and TypeScript in Node 22
        run: docker build --file Dockerfile.production --target checks --tag kenangin:checks .

      # CI hanya membuktikan build/startup; kredensial layanan tidak dibutuhkan.
      # Image rilis nanti harus dibangun dengan NEXT_PUBLIC_* milik server tujuan.
      - name: Build production image
        run: docker build --file Dockerfile.production --tag kenangin:ci .

      - name: Check container startup
        shell: bash
        run: |
          docker run --detach --name kenangin-ci kenangin:ci
          for _ in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' kenangin-ci)
            if [ "$status" = healthy ]; then
              echo 'Production container is healthy.'
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              break
            fi
            sleep 2
          done
          echo 'Container did not become healthy within 60 seconds.' >&2
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs --tail 100 kenangin-ci || true

      - name: Remove test container
        if: always()
        run: docker rm --force kenangin-ci 2>/dev/null || true

  publish-dockerhub:
    needs: check-and-build
    # Pull request dan branch fitur hanya diperiksa, tidak memublikasikan image.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_REPOSITORY: hwrdfarr/kenangin
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate publication configuration
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=0
          for name in DOCKERHUB_TOKEN NEXT_PUBLIC_APP_URL NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN NEXT_PUBLIC_FIREBASE_PROJECT_ID NEXT_PUBLIC_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Set $name in repository Actions secrets/variables before publishing."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Build image with public app configuration
        shell: bash
        run: |
          docker build --file Dockerfile.production \
            --build-arg NEXT_PUBLIC_APP_URL \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE_REPOSITORY:sha-$GITHUB_SHA" \
            --tag "$IMAGE_REPOSITORY:latest" .

      - name: Check the image before publishing
        shell: bash
        run: |
          docker run --detach --name kenangin-publish "$IMAGE_REPOSITORY:sha-$GITHUB_SHA"
          for _ in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' kenangin-publish)
            if [ "$status" = healthy ]; then
              echo 'Image startup check passed.'
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              break
            fi
            sleep 2
          done
          echo '::error::Image did not become healthy within 60 seconds.'
          exit 1

      - name: Sign in to Docker Hub
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username hwrdfarr --password-stdin

      - name: Push versioned image and latest tag
        shell: bash
        run: |
          docker push "$IMAGE_REPOSITORY:sha-$GITHUB_SHA"
          docker push "$IMAGE_REPOSITORY:latest"
          printf 'Published %s:sha-%s and %s:latest.\n' "$IMAGE_REPOSITORY" "$GITHUB_SHA" "$IMAGE_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo 'This publishes an image; deployment to the application server is a separate step.' >> "$GITHUB_STEP_SUMMARY"

      - name: Publication container logs on failure
        if: failure()
        run: docker logs --tail 100 kenangin-publish || true

      - name: Remove publication test container
        if: always()
        run: docker rm --force kenangin-publish 2>/dev/null || true

      - name: Sign out of Docker Hub
        if: always()
        run: docker logout
